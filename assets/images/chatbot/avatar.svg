<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background -->
  <circle cx="60" cy="60" r="60" fill="#5a2d91"/>

  <!-- Shoulders / professional top -->
  <ellipse cx="60" cy="118" rx="44" ry="28" fill="#1e3a5f"/>
  <!-- White collar -->
  <path d="M49,94 L60,107 L71,94" fill="#ffffff" opacity="0.9"/>

  <!-- Neck -->
  <rect x="52" y="78" width="16" height="20" rx="7" fill="#6B3520"/>

  <!-- Head base -->
  <ellipse cx="60" cy="56" rx="27" ry="30" fill="#7A3F22"/>

  <!-- Natural hair — afro silhouette -->
  <ellipse cx="60" cy="32" rx="34" ry="24" fill="#1a0800"/>
  <ellipse cx="30" cy="50" rx="12" ry="18" fill="#1a0800"/>
  <ellipse cx="90" cy="50" rx="12" ry="18" fill="#1a0800"/>

  <!-- Face lighter tone -->
  <ellipse cx="60" cy="59" rx="23" ry="25" fill="#8B4A28"/>

  <!-- Ear left -->
  <ellipse cx="33" cy="62" rx="5" ry="7" fill="#7A3F22"/>
  <!-- Ear right -->
  <ellipse cx="87" cy="62" rx="5" ry="7" fill="#7A3F22"/>

  <!-- Gold earrings -->
  <circle cx="33" cy="68" r="4" fill="#E6B800"/>
  <circle cx="87" cy="68" r="4" fill="#E6B800"/>

  <!-- Eyebrows -->
  <path d="M40,48 Q48,44 56,48" stroke="#1a0800" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M64,48 Q72,44 80,48" stroke="#1a0800" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Eyes — whites -->
  <ellipse cx="48" cy="55" rx="6" ry="5" fill="white"/>
  <ellipse cx="72" cy="55" rx="6" ry="5" fill="white"/>
  <!-- Irises -->
  <circle cx="48" cy="55" r="3.5" fill="#1a0800"/>
  <circle cx="72" cy="55" r="3.5" fill="#1a0800"/>
  <!-- Eye highlights -->
  <circle cx="49.5" cy="53.5" r="1.2" fill="white"/>
  <circle cx="73.5" cy="53.5" r="1.2" fill="white"/>

  <!-- Nose -->
  <path d="M56,66 Q60,73 64,66" stroke="#5a2510" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="57.5" cy="67.5" rx="2.5" ry="1.5" fill="#5a2510" opacity="0.45"/>
  <ellipse cx="62.5" cy="67.5" rx="2.5" ry="1.5" fill="#5a2510" opacity="0.45"/>

  <!-- Lips -->
  <path d="M50,76 Q60,84 70,76" stroke="#5a2510" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M50,76 Q60,82 70,76 Q60,84 50,76" fill="#7B3520" opacity="0.35"/>

  <!-- Cheek blush subtle -->
  <ellipse cx="40" cy="70" rx="7" ry="5" fill="#b56040" opacity="0.2"/>
  <ellipse cx="80" cy="70" rx="7" ry="5" fill="#b56040" opacity="0.2"/>
</svg>
