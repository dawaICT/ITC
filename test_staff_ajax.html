<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Loading Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .result-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .loading { color: #007bff; }
        pre {
            background: white;
            padding: 15px;
            border-radius: 5px;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Staff AJAX Endpoint Test</h1>
        
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Test Staff Retrieval</h5>
                <p class="card-text">This page tests the <code>admin/ajax/staff_min.php</code> endpoint.</p>
                <button id="testBtn" class="btn btn-primary">Load Staff Data</button>
                <button id="clearBtn" class="btn btn-secondary">Clear Results</button>
            </div>
        </div>

        <div id="results" class="result-box d-none">
            <h5>Results:</h5>
            <div id="status"></div>
            <div id="data"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#testBtn').click(function() {
                const $results = $('#results');
                const $status = $('#status');
                const $data = $('#data');
                const $btn = $(this);

                // Show results section
                $results.removeClass('d-none');
                $status.html('<p class="loading">⏳ Loading staff data...</p>');
                $data.html('');
                
                $btn.prop('disabled', true);

                // Make AJAX request
                $.ajax({
                    url: 'admin/ajax/staff_min.php',
                    method: 'GET',
                    dataType: 'json',
                    timeout: 10000
                })
                .done(function(response) {
                    console.log('Response:', response);
                    
                    if (Array.isArray(response) && response.length > 0) {
                        $status.html('<p class="success">✓ Success! Loaded ' + response.length + ' staff members</p>');
                        
                        let html = '<h6>Staff List:</h6><ul class="list-group">';
                        response.forEach(function(staff) {
                            const fullName = (staff.title || '') + ' ' + (staff.Fname || '') + ' ' + (staff.Lname || '');
                            html += '<li class="list-group-item">';
                            html += '<strong>' + staff.staff_id + '</strong>: ' + fullName.trim();
                            html += '<br><small class="text-muted">Email: ' + (staff.email || 'N/A') + ' | Mobile: ' + (staff.phone || staff.mobile || 'N/A') + '</small>';
                            html += '</li>';
                        });
                        html += '</ul>';
                        
                        html += '<h6 class="mt-3">Raw JSON Response:</h6>';
                        html += '<pre>' + JSON.stringify(response, null, 2) + '</pre>';
                        
                        $data.html(html);
                    } else if (response.error) {
                        $status.html('<p class="error">✗ Error: ' + (response.message || 'Unknown error') + '</p>');
                        $data.html('<pre>' + JSON.stringify(response, null, 2) + '</pre>');
                    } else {
                        $status.html('<p class="error">✗ No staff data found or empty response</p>');
                        $data.html('<pre>' + JSON.stringify(response, null, 2) + '</pre>');
                    }
                })
                .fail(function(xhr, status, error) {
                    console.error('AJAX Error:', status, error);
                    console.error('Response:', xhr.responseText);
                    
                    $status.html('<p class="error">✗ Request failed: ' + status + '</p>');
                    
                    let errorHtml = '<div class="alert alert-danger">';
                    errorHtml += '<strong>Error Details:</strong><br>';
                    errorHtml += 'Status: ' + xhr.status + '<br>';
                    errorHtml += 'Status Text: ' + xhr.statusText + '<br>';
                    errorHtml += 'Error: ' + error;
                    errorHtml += '</div>';
                    
                    if (xhr.responseText) {
                        errorHtml += '<h6>Response:</h6>';
                        errorHtml += '<pre>' + xhr.responseText.substring(0, 1000) + '</pre>';
                    }
                    
                    $data.html(errorHtml);
                })
                .always(function() {
                    $btn.prop('disabled', false);
                });
            });

            $('#clearBtn').click(function() {
                $('#results').addClass('d-none');
                $('#status').html('');
                $('#data').html('');
            });
        });
    </script>
</body>
</html>
