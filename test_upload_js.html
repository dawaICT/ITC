<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Button Debug Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Upload Button Debug Test</h2>
        <div class="alert alert-info">
            <strong>Instructions:</strong> Open browser console (F12) to see debug logs
        </div>
        
        <div class="card">
            <div class="card-body">
                <form method="post" enctype="multipart/form-data" class="upload-form" data-session-id="1">
                    <input type="hidden" name="action" value="upload_video" />
                    <input type="hidden" name="csrf_token" value="test_token" />
                    <input type="hidden" name="session_id" value="1" />
                    <input type="hidden" name="MAX_FILE_SIZE" value="524288000" />
                    
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Session</label>
                            <input type="text" class="form-control" disabled value="CSC101: Test Session" />
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Select Video File <span class="text-danger">*</span></label>
                            <input type="file" class="form-control video-input" name="video_file" accept="video/mp4,video/webm,video/ogg,video/quicktime" required />
                            <div class="form-text">
                                Supported: MP4, WebM, OGG, MOV<br>
                                Maximum: 500MB
                            </div>
                            <div class="file-info mt-2 text-muted small"></div>
                        </div>
                        
                        <div class="progress mt-3" style="display: none;">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 100%"></div>
                        </div>
                    </div>
                    
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="alert('Cancel clicked')">Cancel</button>
                        <button type="submit" class="btn btn-primary upload-btn">
                            <i class="fas fa-upload"></i> Upload Video
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="mt-3">
            <h4>Debug Console:</h4>
            <div id="debug-console" class="border p-3 bg-light" style="height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px;">
                Waiting for events...<br>
            </div>
        </div>
    </div>

    <script>
    // Redirect console.log to visible div
    const debugConsole = document.getElementById('debug-console');
    const originalLog = console.log;
    console.log = function(...args) {
        originalLog.apply(console, args);
        debugConsole.innerHTML += args.join(' ') + '<br>';
        debugConsole.scrollTop = debugConsole.scrollHeight;
    };

    // Same JavaScript as in sessions.php
    document.addEventListener('DOMContentLoaded', function() {
        console.log('=== DOM Content Loaded ===');
        
        // File upload validation and UI feedback
        document.querySelectorAll('.video-input').forEach(input => {
            console.log('Attaching event to video input');
            
            input.addEventListener('change', function() {
                const file = this.files[0];
                const formGroup = this.closest('.mb-3');
                const infoDiv = formGroup ? formGroup.querySelector('.file-info') : null;
                const uploadBtn = this.closest('form').querySelector('.upload-btn');
                
                console.log('File selected:', file ? file.name : 'none');
                console.log('Info div found:', infoDiv ? 'yes' : 'no');
                console.log('Upload button found:', uploadBtn ? 'yes' : 'no');
                
                if (file && infoDiv) {
                    const sizeMB = (file.size / 1048576).toFixed(2);
                    const validTypes = ['video/mp4', 'video/webm', 'video/ogg', 'video/quicktime'];
                    
                    console.log('File type:', file.type);
                    console.log('File size:', sizeMB, 'MB');
                    
                    if (!validTypes.includes(file.type)) {
                        infoDiv.innerHTML = '<span class="text-danger"><i class="fas fa-times"></i> Invalid file type: ' + file.type + '</span>';
                        if (uploadBtn) uploadBtn.disabled = true;
                    } else if (file.size > 500 * 1048576) {
                        infoDiv.innerHTML = '<span class="text-danger"><i class="fas fa-times"></i> File too large (' + sizeMB + ' MB). Max: 500 MB</span>';
                        if (uploadBtn) uploadBtn.disabled = true;
                    } else {
                        infoDiv.innerHTML = '<span class="text-success"><i class="fas fa-check"></i> ' + file.name + ' (' + sizeMB + ' MB) - Ready to upload</span>';
                        if (uploadBtn) uploadBtn.disabled = false;
                    }
                } else if (!file && infoDiv) {
                    infoDiv.innerHTML = '';
                    if (uploadBtn) uploadBtn.disabled = false;
                }
            });
        });
        
        // Show progress bar during upload
        document.querySelectorAll('.upload-form').forEach(form => {
            console.log('Attaching submit handler to form');
            
            form.addEventListener('submit', function(e) {
                e.preventDefault(); // Prevent actual submission for testing
                
                const fileInput = this.querySelector('.video-input');
                const file = fileInput ? fileInput.files[0] : null;
                
                console.log('Form submit triggered');
                
                // Validate file exists
                if (!file) {
                    alert('Please select a video file to upload.');
                    console.log('ERROR: No file selected');
                    return false;
                }
                
                // Validate file size client-side
                if (file.size > 500 * 1048576) {
                    alert('File is too large. Maximum size is 500MB.');
                    console.log('ERROR: File too large');
                    return false;
                }
                
                // Show progress indicators
                const progressDiv = this.querySelector('.progress');
                const uploadBtn = this.querySelector('.upload-btn');
                
                if (progressDiv) {
                    progressDiv.style.display = 'block';
                    console.log('Progress bar shown');
                }
                
                if (uploadBtn) {
                    uploadBtn.disabled = true;
                    uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
                    console.log('Upload button disabled');
                }
                
                console.log('SUCCESS: Form would submit with file:', file.name, '(' + (file.size / 1048576).toFixed(2) + ' MB)');
                
                // Simulate upload completion after 3 seconds
                setTimeout(function() {
                    console.log('Simulated upload complete - resetting form');
                    if (progressDiv) progressDiv.style.display = 'none';
                    if (uploadBtn) {
                        uploadBtn.disabled = false;
                        uploadBtn.innerHTML = '<i class="fas fa-upload"></i> Upload Video';
                    }
                }, 3000);
                
                return false; // Prevent actual submission
            });
        });
        
        console.log('=== Initialization Complete ===');
        console.log('Found', document.querySelectorAll('.video-input').length, 'video input(s)');
        console.log('Found', document.querySelectorAll('.upload-form').length, 'upload form(s)');
    });
    </script>
</body>
</html>
